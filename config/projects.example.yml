# tmux-session-manager project configuration
#
# Each project defines a workspace that tms can launch.
#
# Required fields:
#   name  — Unique project identifier (used as tmux session name).
#           Must not contain dots or colons.
#   dir   — Absolute path to the project directory. Tilde (~) is expanded.
#
# Optional fields:
#   servers — List of background processes to run in popup windows.
#     Each server entry has:
#       name  — Display name shown in popup title (required)
#       cmd   — Shell command to run (required)
#       dir   — Working directory override (optional, defaults to project dir)
#
#   notifications — Controls macOS notification banners via tms install-hooks.
#     notifications.enabled  — bool, default true. Set to false to suppress
#                              macOS banners for this project (opt-out). The
#                              tmux visual bell is unaffected by this flag.
#     notifications.sound    — string, optional. macOS system sound name
#                              (e.g. "Submarine", "Glass", "Tink", "Ping",
#                              "Sosumi") or "default" for the system default.
#                              Plays when the banner fires. Explicit empty
#                              string ("") overrides the global default with
#                              silence. Absent key inherits the global value.
#
# Top-level fields (siblings of projects:):
#   notifications.sound — string, optional. Default sound applied to every
#                         project that doesn't set its own notifications.sound.
#                         Same value format as above.

# Example: set a default sound for every project.
notifications:
  sound: "Submarine"

projects:
  - name: my-webapp
    dir: ~/Projects/my-webapp
    servers:
      - name: dev-server
        cmd: npm run dev
      - name: db
        cmd: docker compose up postgres

  - name: api-service
    dir: ~/Projects/api-service
    servers:
      - name: api
        cmd: cargo run --release

  - name: dotfiles
    dir: ~/dotfiles
    # No servers — just neovim + Claude Code

  - name: quiet-project
    dir: ~/Projects/quiet-project
    notifications:
      enabled: false   # suppress macOS banners for this project; tmux visual bell still fires

  - name: critical-app
    dir: ~/Projects/critical-app
    notifications:
      sound: "Sosumi"  # louder per-project override (takes priority over the global "Submarine")

  - name: silent-override
    dir: ~/Projects/silent-override
    notifications:
      sound: ""        # explicit silence, overrides the global default sound
