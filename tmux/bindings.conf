# tmux-session-manager key bindings
# Loaded automatically by tms when creating a session.
# Bindings only activate in tms-managed sessions (tagged with @tms).

# prefix + P — Switch between tms project sessions
bind-key P run-shell 'if [ "#{@tms}" = "1" ]; then tmux display-popup -T " Active Coding Sessions " -E "#{@tms_dir}/bin/tms-switch"; fi'

# prefix + S — Toggle between workspace and _servers window
bind-key S run-shell 'if [ "#{@tms}" = "1" ]; then if [ "#{window_name}" = "_servers" ]; then tmux select-window -t "#{session_name}:workspace"; else tmux select-window -t "#{session_name}:_servers" 2>/dev/null || tmux display-message "No servers configured for this project."; fi; fi'
