# tmux-session-manager key bindings
#
# Installation: Add the following lines to your ~/.tmux.conf:
#
#   TMS_DIR="/path/to/claude-code-tmux-manager"
#   source-file "$TMS_DIR/tmux/bindings.conf"
#
# Replace /path/to/claude-code-tmux-manager with the actual path.
# Then reload tmux config:
#   tmux source-file ~/.tmux.conf

# prefix + P — Switch between project sessions using built-in session chooser
bind-key P choose-tree -s

# prefix + S — Toggle server popup for the current session
# Shows the _servers window in a display-popup. If no server window exists,
# the popup briefly shows "No servers configured" and exits.
bind-key S display-popup -w 80% -h 80% -E \
  "tmux list-windows -t '#{session_name}' -F '#{window_name}' | grep -q '^_servers$' \
    && tmux attach-session -t '#{session_name}:_servers' \
    || (echo 'No servers configured for this project.' && sleep 2)"
